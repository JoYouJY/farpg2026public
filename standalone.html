<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Legacy Re-Implementation</title>
    <link rel="stylesheet" href="TemplateData/style.css" />
    <meta name="theme-color" content="#000000" />
    <!-- NOTE: NO VIEWPORT META TAG, AS PER LEGACY -->
</head>

<style>
    body,
    html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
    }

    #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background-color: rgba(0, 0, 0, 0.5);
    }
</style>

<body style="background-color: #000000">
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width="1920" height="1080"></canvas>
        <div id="unity-loading-bar" style="display: none;"></div>
    </div>

    <!-- Legacy Resize Logic -->
    <script>
        var canvas = document.querySelector("#unity-canvas");
        const ASPECT_RATIO = 16 / 9;

        function resizeCanvas() {
            var windowWidth = window.innerWidth;
            var windowHeight = window.innerHeight;
            var windowRatio = windowWidth / windowHeight;

            var newWidth, newHeight;

            if (windowRatio > ASPECT_RATIO) {
                newHeight = windowHeight;
                newWidth = newHeight * ASPECT_RATIO;
            } else {
                newWidth = windowWidth;
                newHeight = newWidth / ASPECT_RATIO;
            }

            canvas.style.width = newWidth + "px";
            canvas.style.height = newHeight + "px";
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
        setInterval(resizeCanvas, 1000); // Robust check
    </script>

    <!-- Chunk Loader Logic -->
    <script>
        async function loadAndCombineChunks(baseUrl, totalChunks) {
            console.log("Starting to load and combine chunks...");
            const chunkUrls = Array.from({ length: totalChunks }, (_, i) => `${baseUrl}/build.data.${String(i + 1).padStart(2, '0')}`);

            const chunks = new Array(totalChunks);
            let loadedCount = 0;

            await Promise.all(chunkUrls.map(async (url, index) => {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`Failed to load chunk ${url}`);
                const buffer = await res.arrayBuffer();
                chunks[index] = buffer;
                loadedCount++;
                console.log(`Chunk ${index + 1}/${totalChunks} loaded.`);
            }));

            console.log("All chunks downloaded. Creating Blob...");
            const blob = new Blob(chunks, { type: "application/octet-stream" });
            return URL.createObjectURL(blob);
        }

        function loadUnity() {
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/Build.loader.js";

            // Manual Chunk Loading Strategy
            loadAndCombineChunks(buildUrl, 19).then((dataUrl) => {
                console.log("Blob created:", dataUrl);

                var config = {
                    dataUrl: dataUrl,
                    frameworkUrl: buildUrl + "/Build.framework.js",
                    codeUrl: buildUrl + "/Build.wasm",
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "Jojo Dream Studio",
                    productName: "FateAdventureRPG",
                    productVersion: "1.0.0",
                };

                var script = document.createElement("script");
                script.src = loaderUrl;
                script.onload = () => {
                    createUnityInstance(canvas, config, (progress) => {
                        console.log("Progress:", progress);
                    }).then((unityInstance) => {
                        window.unityInstance = unityInstance;
                    }).catch((message) => {
                        alert(message);
                    });
                };
                document.body.appendChild(script);

            }).catch((err) => {
                console.error("Failed to load chunks:", err);
                alert("Failed to load game data. Check console.");
            });
        }

        loadUnity();
    </script>
</body>

</html>
